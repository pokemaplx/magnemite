services:
  hub:
    build:
      context: ..
      dockerfile: apps/hub/Dockerfile
      args:
        DB_PROVIDER: ${DB_PROVIDER:-mysql}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_PROVIDER: ${DB_PROVIDER:-mysql}
      # The external database, set in the Environment tab. The default below is
      # only the shape to copy -- replace all four angle-bracket parts:
      #
      #   <user>      the database user
      #   <password>  its password
      #   <host>      the hostname *this container* can reach. A Coolify
      #               database resource shows it as its internal hostname on
      #               the shared network -- not the public one it may also
      #               publish, which a restart or the firewall can move.
      #   <database>  the database name, e.g. magnemite
      DATABASE_URL: ${DATABASE_URL:-mysql://<user>:<password>@<host>:3306/<database>}
      HUB_PORT: 3001
      HUB_INTERNAL_SECRET: ${SERVICE_PASSWORD_HUBSECRET}
      # Two different audiences, two different hosts on Coolify:
      #   MAGNEMITE_PUBLIC_URL    -- what the *boxes* reach (the edge). Every
      #                              artifact URL and the ws:// enrolment URL
      #                              are built from it.
      #   MAGNEMITE_DASHBOARD_URL -- what a *person* reaches. Only the links in
      #                              Discord alerts are built from it; on the
      #                              edge's domain those would 404.
      #
      # Each falls back to the domain Coolify generates from the service's
      # SERVICE_URL_* declaration. Setting either by hand in the Environment
      # tab overrides it -- and is worth doing after editing a domain in the
      # UI, because the generic SERVICE_URL_* is not always refreshed with the
      # port-carrying one: https://github.com/coollabsio/coolify/issues/8912
      MAGNEMITE_PUBLIC_URL: ${MAGNEMITE_PUBLIC_URL:-${SERVICE_URL_EDGE}}
      MAGNEMITE_DASHBOARD_URL: ${MAGNEMITE_DASHBOARD_URL:-${SERVICE_URL_WEB}}
      ARTIFACT_DIR: /data/artifacts
      # The edge serves /files/* off the shared volume, so Node never does.
      SERVE_ARTIFACTS: "false"
      # The hub image carries the agent binaries it was built with and updates
      # the fleet to them as boxes reconnect. Set to "false" to pin the agents
      # and drive updates by hand instead.
      AGENT_AUTO_UPDATE: ${AGENT_AUTO_UPDATE:-true}
      ROTOM_ENABLED: ${ROTOM_ENABLED:-false}
      ROTOM_URL: ${ROTOM_URL:-}
      ROTOM_SECRET: ${ROTOM_SECRET:-}
      ROTOM_BASIC_USERNAME: ${ROTOM_BASIC_USERNAME:-}
      ROTOM_BASIC_PASSWORD: ${ROTOM_BASIC_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@magnemite.com}
      ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN}
      # --- Web push -----------------------------------------------------
      # The VAPID keypair identifies this server to every push service the
      # dashboard's browsers use. Generate once with
      # `npx web-push generate-vapid-keys` -- regenerating it silently
      # unsubscribes every browser. Absent simply leaves web push unavailable.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
    volumes:
      - artifacts:/data/artifacts
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3001/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # The piece Coolify's proxy cannot be: a file server with the artifacts
  # volume mounted. Everything the boxes touch goes through here.
  edge:
    build:
      # Built rather than pulled, so the Caddyfile travels inside the image.
      # Coolify turns a file bind mount into a mount of its own, which means
      # the config in the container is the copy on the server rather than the
      # one in this repository — and a stale one 404s a new route with nothing
      # obviously wrong.
      context: ./edge
      args:
        CADDYFILE: Caddyfile.coolify
    restart: unless-stopped
    depends_on:
      hub:
        condition: service_started
    environment:
      # Declared with no value on purpose: Coolify fills it from the Domains
      # tab. Writing `${SERVICE_URL_EDGE_8090}` here would interpolate a
      # variable that does not exist yet and blank it out. Map form, not a
      # list item -- Coolify's compose preview turns `- SERVICE_URL_EDGE_8090`
      # into a numeric key and the deploy fails with "non-string key in
      # services.edge.environment: 0".
      #
      # The port goes in the *name*: `_8090` is what tells the proxy which
      # container port the domain routes to, so no `:8090` is typed into the
      # Domains tab. One declaration yields four variables -- the two carrying
      # the port, for routing, and the generic SERVICE_URL_EDGE /
      # SERVICE_FQDN_EDGE, which is what the apps below read.
      SERVICE_URL_EDGE_8090:
      HUB_PORT: 3001
    volumes:
      # Read-only: Caddy streams the cached .apkm files straight off here, so
      # the ~35 GB of a full rollout never passes through Node.
      - artifacts:/srv/artifacts:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8090/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      # Same as the hub: the Prisma Client is generated at image build time,
      # so the provider has to be set there too.
      args:
        DB_PROVIDER: ${DB_PROVIDER:-mysql}
    restart: unless-stopped
    depends_on:
      hub:
        condition: service_started
    environment:
      # Same shape as the edge above: no value, port in the name.
      SERVICE_URL_WEB_3000:
      NODE_ENV: production
      DB_PROVIDER: ${DB_PROVIDER:-mysql}
      DATABASE_URL: ${DATABASE_URL:-mysql://<user>:<password>@<host>:3306/<database>}
      AUTH_SECRET: ${SERVICE_BASE64_64_AUTHSECRET}
      MAGNEMITE_PUBLIC_URL: ${MAGNEMITE_PUBLIC_URL:-${SERVICE_URL_EDGE}}
      MAGNEMITE_DASHBOARD_URL: ${MAGNEMITE_DASHBOARD_URL:-${SERVICE_URL_WEB}}
      HUB_URL: http://hub:3001
      HUB_INTERNAL_SECRET: ${SERVICE_PASSWORD_HUBSECRET}
      # The public half only. The browser needs it to subscribe; the private
      # half stays on the hub, which is what signs the pushes.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/login || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  artifacts:
  caddy_data:
  caddy_config:
