name: magnemite

# Pulled, not built.
#
# CI publishes one image per deployable on every push to main
# (.github/workflows/images.yml), so a deploy here is
#
#   docker compose --env-file .env -f deploy/docker-compose.yml pull
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d
#
# rather than minutes of Go cross-compilation and a Next build on the machine
# that is holding the fleet's sockets. `up -d --build` still works and still
# wins: it rebuilds from this checkout and tags the result under the same name,
# which is the path to take on Postgres -- see the note on DB_PROVIDER below --
# or anywhere GHCR cannot be reached.
#
# Each image is a variable so a fork can point at its own registry without
# editing this file, and so a release is pinned by naming its tag:
# `HUB_IMAGE=ghcr.io/pokemaplx/magnemite/hub:1.0.4` in .env. The numbers are
# the VERSION file's, one per deployable, and rolling back is naming the
# previous one.
services:
  hub:
    # `latest` is the last push to main. The published hub and dashboard carry
    # a **MariaDB/MySQL** Prisma Client, which is what DB_PROVIDER defaults to
    # here; on Postgres they are the wrong half of that build and the deploy
    # has to be `up -d --build`.
    image: ${HUB_IMAGE:-ghcr.io/pokemaplx/magnemite/hub:latest}
    # Pull a missing image instead of silently building it, which is what makes
    # a fresh machine take seconds rather than ten minutes. The cost is that a
    # machine with no route to GHCR fails here instead of falling back, and
    # needs `--build` once.
    pull_policy: missing
    build:
      context: ..
      dockerfile: apps/hub/Dockerfile
      # The Prisma Client baked into the image at build time has to match the
      # DATABASE_URL below, so this is a build arg, not just a runtime one.
      args:
        DB_PROVIDER: ${DB_PROVIDER:-mysql}
    container_name: magnemite-hub
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_PROVIDER: ${DB_PROVIDER:-mysql}
      DATABASE_URL: ${DATABASE_URL}
      # Fixed, like ARTIFACT_DIR below and for the same reason: it is a port
      # inside the compose network, so nothing outside can see it and nothing
      # gains from moving it. Taking it from .env let HUB_PORT drift away from
      # the `expose` and the Caddyfile, both of which say 3001 outright.
      HUB_PORT: 3001
      HUB_INTERNAL_SECRET: ${HUB_INTERNAL_SECRET}
      MAGNEMITE_PUBLIC_URL: ${MAGNEMITE_PUBLIC_URL}
      # Alert links point at a dashboard page, so they are built on the
      # dashboard's origin. One domain here, so it is the same value.
      MAGNEMITE_DASHBOARD_URL: ${MAGNEMITE_DASHBOARD_URL:-${MAGNEMITE_PUBLIC_URL}}
      # Container path, deliberately not taken from .env — it has to match the
      # volume mounted into caddy as /srv/artifacts.
      ARTIFACT_DIR: /data/artifacts
      # The hub image carries the agent binaries it was built with and updates
      # the fleet to them as boxes reconnect. Set to "false" to pin the agents
      # and drive updates by hand instead.
      AGENT_AUTO_UPDATE: ${AGENT_AUTO_UPDATE:-true}
      ROTOM_ENABLED: ${ROTOM_ENABLED:-false}
      ROTOM_URL: ${ROTOM_URL:-}
      ROTOM_SECRET: ${ROTOM_SECRET:-}
      ROTOM_BASIC_USERNAME: ${ROTOM_BASIC_USERNAME:-}
      ROTOM_BASIC_PASSWORD: ${ROTOM_BASIC_PASSWORD:-}
      # The admin login. The hub syncs the account to these on every boot, so
      # changing ADMIN_PASSWORD and bringing the hub up again is the way back
      # in -- which only works if they reach the container, and compose passes
      # nothing it is not told to. ADMIN_PASSWORD is required rather than
      # defaulted because nothing downstream validates it: an unset variable
      # arrives as an empty string and the hub sets that as the password, and
      # a default here would put every deploy on the same known one.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}"
      # --- Web push -----------------------------------------------------
      # The VAPID keypair identifies this server to every push service the
      # dashboard's browsers use. Generate once with
      # `npx web-push generate-vapid-keys` -- regenerating it silently
      # unsubscribes every browser. Absent simply leaves web push unavailable.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      # --- Debugging ----------------------------------------------------
      # Read straight off the environment rather than through the schema in
      # env.ts, so they do nothing unless they are passed here. Both carry a
      # default rather than `:-`: an unset variable arrives as an empty
      # string, and `""` is not nullish, so it would reach pino as a log level
      # and throw. `info` is what log.ts picks anyway with NODE_ENV=production.
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PRISMA_LOG: ${PRISMA_LOG:-0}
    volumes:
      - artifacts:/data/artifacts
    expose:
      - "3001"

  web:
    image: ${WEB_IMAGE:-ghcr.io/pokemaplx/magnemite/web:latest}
    pull_policy: missing
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      # The Prisma Client baked into the image at build time has to match the
      # DATABASE_URL below, so this is a build arg, not just a runtime one.
      args:
        DB_PROVIDER: ${DB_PROVIDER:-mysql}
    container_name: magnemite-web
    restart: unless-stopped
    depends_on:
      hub:
        condition: service_started
    environment:
      NODE_ENV: production
      DB_PROVIDER: ${DB_PROVIDER:-mysql}
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      # Behind Caddy the dashboard and the agents share one origin, so Better
      # Auth's origin check uses the same URL. The Coolify setup splits them.
      MAGNEMITE_DASHBOARD_URL: ${MAGNEMITE_DASHBOARD_URL:-${MAGNEMITE_PUBLIC_URL}}
      # The override for when that is not the origin Better Auth should build
      # callbacks on. Empty is safe here, unlike above: the candidates are
      # filtered on truthiness, so an unset one falls through to the next.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
      MAGNEMITE_PUBLIC_URL: ${MAGNEMITE_PUBLIC_URL}
      HUB_URL: http://hub:3001
      HUB_INTERNAL_SECRET: ${HUB_INTERNAL_SECRET}
      # The public half only. The browser needs it to subscribe; the private
      # half stays on the hub, which is what signs the pushes.
      # The dashboard opens a Prisma client of its own, so turning queries on
      # for the hub alone would show half of them.
      PRISMA_LOG: ${PRISMA_LOG:-0}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    expose:
      - "3000"

  caddy:
    # The published edge carries the plain `Caddyfile`, which is the one this
    # file's stack wants. The Coolify variant is a build arg and is built
    # there, from the repository.
    image: ${CADDY_IMAGE:-ghcr.io/pokemaplx/magnemite/caddy:latest}
    pull_policy: missing
    build:
      # The Caddyfile travels inside the image rather than as a bind mount:
      # a bind-mounted config is one more thing that has to be in the right
      # state on the server, and a stale one 404s a new route with nothing
      # obviously wrong.
      context: ./edge
    container_name: magnemite-caddy
    restart: unless-stopped
    depends_on:
      - web
      - hub
    environment:
      HUB_PORT: 3001
    ports:
      # Plain HTTP: your own reverse proxy terminates TLS and forwards here.
      - "${EDGE_PORT:-8090}:8090"
    volumes:
      # Caddy streams the cached .apkm files straight off this volume, so the
      # ~35 GB of a full rollout never touches Node.
      - artifacts:/srv/artifacts:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  artifacts:
  caddy_data:
  caddy_config:
